<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ADStore</title>
<meta name="description" content="Free worldwide tracked shipping. 100% secure checkout. 30-day returns.">
<meta name="theme-color" content="#fbf8f5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<base href="/">
</head>
<body>
<div class="announce"><div class="announce-track" id="announce">
  <span>Free worldwide shipping</span><span>30-day returns</span><span>100% secure checkout</span>
</div></div>

<header class="site-header">
  <div class="wrap header-row">
    <a href="/" class="logo" id="logo">ADStore</a>
    <nav class="header-links"><a href="#faq">Help</a></nav>
  </div>
</header>

<main id="app"><div class="loading"><span></span></div></main>

<footer class="site-footer">
  <div class="wrap footer-grid">
    <div>
      <div class="logo" id="logo-foot">ADStore</div>
      <p class="muted small">Payments processed by Stripe. We never see your card details.</p>
    </div>
    <div class="footer-links">
      <a href="/legal.html">Legal notice</a>
      <a href="/legal.html#privacy">Privacy</a>
      <a href="/legal.html#returns">Shipping &amp; returns</a>
    </div>
  </div>
  <div class="wrap small muted copy">© <span id="year"></span> ADStore</div>
</footer>

<dialog id="size-dialog" class="sheet">
  <form method="dialog"><button class="sheet-close" aria-label="Close">✕</button></form>
  <div id="size-content"></div>
</dialog>

<div class="sticky-buy" id="sticky" hidden>
  <img id="sticky-img" alt="">
  <div class="sticky-info"><div class="sticky-name" id="sticky-name"></div><div class="sticky-price" id="sticky-price"></div></div>
  <button class="btn btn-dark" id="sticky-btn">Buy now</button>
</div>

<script>
const ICONS = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  truck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  ret: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
  waist: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3c0 5 2 6 2 9s-2 4-2 9M17 3c0 5-2 6-2 9s2 4 2 9"/><path d="M9.5 12h5"/></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  air: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/></svg>',
  ruler: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};
const fmt = c => new Intl.NumberFormat("en-US", { style: "currency", currency: (window.CFG && CFG.currency) || "usd" }).format(c / 100);
const qs = new URLSearchParams(location.search);
const S = { qty: 1, items: [{ variant: null, size: null }], showErr: false }; // una entrada por unidad
let P = null;

function addBusinessDays(d, n) { d = new Date(d); while (n > 0) { d.setDate(d.getDate() + 1); if (d.getDay() % 6) n--; } return d; }
const dShort = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });

function unitPrice(qty) {
  const v0 = S.items[0].variant;
  const base = (v0 && v0.price) || P.price;
  const b = (P.bundles || []).find(x => x.qty === qty);
  return Math.round(base * (1 - ((b && b.discount) || 0) / 100));
}

function gallery(p) {
  const imgs = [...new Set([...(p.variants || []).map(v => v.image).filter(Boolean), ...p.images])];
  return `
  <div class="gallery">
    <div class="main-img" id="main-img-wrap">
      ${p.compareAt ? `<span class="sale-badge">-${Math.round(100 - p.price / p.compareAt * 100)}%</span>` : ""}
      <div class="slides" id="slides">${imgs.map((src, i) => `<img src="${src}" alt="${p.name}" ${i ? 'loading="lazy"' : ""} data-i="${i}">`).join("")}</div>
    </div>
    ${imgs.length > 1 ? `<div class="thumbs">${imgs.map((src, i) => `<button class="thumb${i ? "" : " on"}" data-src="${src}" onclick="goSlide(${i})"><img src="${src}" alt=""></button>`).join("")}</div>` : ""}
  </div>`;
}

function productPage(p) {
  const today = new Date();
  const from = addBusinessDays(today, 8), to = addBusinessDays(today, 15);
  const save = p.compareAt ? p.compareAt - p.price : 0;
  return `
  ${qs.get("cancelado") ? '<div class="wrap"><p class="note">Payment was cancelled. Your selection is still here, you can try again.</p></div>' : ""}
  <section class="wrap product">
    ${gallery(p)}
    <div class="buybox" id="buybox">
      ${p.badge ? `<span class="pill">${p.badge}</span>` : ""}
      <h1>${p.name}</h1>
      <p class="tagline">${p.tagline}</p>
      <div class="price-row">
        <span class="price" id="price">${fmt(p.price)}</span>
        ${p.compareAt ? `<s class="compare">${fmt(p.compareAt)}</s><span class="save">You save ${fmt(save)}</span>` : ""}
      </div>
      <p class="tax small muted">Free worldwide shipping</p>

      <ul class="checks">${p.bullets.map(b => `<li>${ICONS.check}<span>${b}</span></li>`).join("")}</ul>

      ${p.bundles ? `
      <div class="opt">
        <div class="opt-label">1. Choose your bundle</div>
        <div class="bundles" id="bundles">${p.bundles.map((b, i) => `
          <label class="bundle${i ? "" : " on"}">
            <input type="radio" name="bundle" value="${b.qty}" ${i ? "" : "checked"} onchange="pickQty(${b.qty}, this)">
            ${b.tag ? `<span class="bundle-tag">${b.tag}</span>` : ""}
            <span class="bundle-main"><b>${b.label}</b>${b.discount ? `<span class="bundle-off">-${b.discount}%</span>` : ""}</span>
            <span class="bundle-price" data-qty="${b.qty}"></span>
          </label>`).join("")}
        </div>
      </div>` : `
      <div class="opt"><div class="opt-label">Quantity</div>
        <div class="stepper"><button type="button" onclick="step(-1)">−</button><span id="qtyv">1</span><button type="button" onclick="step(1)">+</button></div></div>`}

      ${p.variants || p.sizes ? `
      <div class="opt">
        <div class="opt-label opt-between"><span>${p.bundles ? "2. " : ""}Choose color${p.sizes ? " &amp; size" : ""}</span>
          ${p.sizeGuide ? `<button class="link-btn" onclick="openSizes()">${ICONS.ruler} Size guide</button>` : ""}</div>
        <div id="units"></div>
      </div>` : ""}

      <button class="btn btn-dark btn-buy" id="buy-btn" onclick="buy(this)">Buy now · <span id="btn-total">${fmt(p.price)}</span></button>
      <p class="err-msg" id="buy-err" hidden></p>

      <div class="delivery">${ICONS.truck}<div><b>Order today, estimated delivery ${dShort(from)} – ${dShort(to)}</b><span class="small muted">Free tracked shipping · US, UK &amp; Europe. Other countries may take a bit longer.</span></div></div>

      <div class="pay-row">
        <span class="small muted">${ICONS.lock} Secure checkout with</span>
        <span class="paym">VISA</span><span class="paym">Mastercard</span><span class="paym">Apple Pay</span><span class="paym">Google Pay</span>
      </div>

      ${p.details ? `<div class="accordion">${p.details.map((d, i) => `
        <details ${i ? "" : "open"}><summary>${d.title}${ICONS.plus}</summary><p>${d.text}</p></details>`).join("")}</div>` : ""}
    </div>
  </section>

  <section class="trust-strip">
    <div class="wrap trust-grid">
      <div>${ICONS.truck}<b>Free shipping</b><span>Worldwide, tracked</span></div>
      <div>${ICONS.ret}<b>30 days</b><span>To return it</span></div>
      <div>${ICONS.lock}<b>Secure payment</b><span>Processed by Stripe</span></div>
    </div>
  </section>

  ${p.highlights ? `
  <section class="wrap section">
    <h2 class="section-title">Why you'll love it</h2>
    <div class="highlights">${p.highlights.map(h => `
      <div class="hl"><div class="hl-icon">${ICONS[h.icon] || ICONS.check}</div><h3>${h.title}</h3><p>${h.text}</p></div>`).join("")}
    </div>
  </section>` : ""}

  ${(p.variants || []).length > 1 ? `
  <section class="wrap section split">
    <div class="split-imgs">${p.variants.slice(0, 2).map(v => `<figure><img src="${v.image}" alt="${p.name} ${v.name}" loading="lazy"><figcaption>${v.name}</figcaption></figure>`).join("")}</div>
    <div class="split-text">
      <h2 class="section-title left">An essential for every outfit</h2>
      <p class="muted">In ${p.variants.map(v => v.name.toLowerCase()).join(" and ")}: pick the shade that matches your outfit so it stays invisible under light or dark clothes.</p>
      <button class="btn btn-outline" onclick="scrollToBuy()">Choose my size</button>
    </div>
  </section>` : ""}

  <section class="guarantee">
    <div class="wrap guarantee-in">
      <div class="seal">30<small>days</small></div>
      <div><h2>Try it risk-free</h2><p>Not convinced, or the size isn't right? You have 30 days from delivery to return it. No hassle.</p></div>
    </div>
  </section>

  ${p.faq ? `
  <section class="wrap section narrow" id="faq">
    <h2 class="section-title">Frequently asked questions</h2>
    <div class="accordion">${p.faq.map(f => `<details><summary>${f.q}${ICONS.plus}</summary><p>${f.a}</p></details>`).join("")}</div>
  </section>` : ""}

  <section class="wrap section final-cta">
    <h2 class="section-title">${p.name}</h2>
    <p class="muted">${fmt(p.price)} ${p.compareAt ? `<s>${fmt(p.compareAt)}</s>` : ""} · Free shipping</p>
    <button class="btn btn-dark" onclick="scrollToBuy()">I want it</button>
  </section>`;
}

function grid(list) {
  return `<section class="wrap section"><h1 class="section-title">Our products</h1><div class="grid">${list.map(p => `
    <a class="card" href="/${p.id}"><div class="card-img"><img src="${p.images[0]}" alt="${p.name}">${p.compareAt ? `<span class="sale-badge">-${Math.round(100 - p.price / p.compareAt * 100)}%</span>` : ""}</div>
    <h3>${p.name}</h3><p><b>${fmt(p.price)}</b> ${p.compareAt ? `<s class="muted">${fmt(p.compareAt)}</s>` : ""}</p></a>`).join("")}</div></section>`;
}

function refresh() {
  const u = unitPrice(S.qty);
  document.getElementById("price").textContent = fmt(unitPrice(1));
  document.getElementById("btn-total").textContent = fmt(u * S.qty);
  document.querySelectorAll(".bundle-price").forEach(el => {
    const q = +el.dataset.qty, up = unitPrice(q);
    el.innerHTML = `<b>${fmt(up * q)}</b>${q > 1 ? `<small>${fmt(up)} each</small>` : ""}`;
  });
  document.getElementById("sticky-price").textContent = fmt(u * S.qty);
  const it0 = S.items[0];
  document.getElementById("sticky-name").textContent = S.qty > 1 ? `Bundle of ${S.qty}` : ([it0.variant && it0.variant.name, it0.size && "Size " + it0.size].filter(Boolean).join(" · ") || P.name);
  document.getElementById("sticky-img").src = (it0.variant && it0.variant.image) || P.images[0];
}

function goSlide(i) {
  const slides = document.getElementById("slides");
  slides.scrollTo({ left: slides.clientWidth * i, behavior: "smooth" });
  document.querySelectorAll(".thumb").forEach((t, j) => t.classList.toggle("on", i === j));
}
function renderUnits() {
  const box = document.getElementById("units");
  if (!box) return;
  const multi = S.items.length > 1;
  box.className = multi ? "units multi" : "units";
  box.innerHTML = S.items.map((it, i) => `
    <div class="unit${S.showErr && P.sizes && !it.size ? " missing" : ""}">
      ${multi ? `<div class="unit-head"><span class="pack-n">${i + 1}</span><b>Item ${i + 1}</b><span class="unit-sum">${[it.variant && it.variant.name, it.size && "Size " + it.size].filter(Boolean).join(" · ")}</span></div>` : ""}
      ${P.variants ? `
      <div class="unit-line">
        ${multi ? "" : `<div class="opt-sub">Color: <b>${it.variant.name}</b></div>`}
        <div class="swatches">${P.variants.map(v => `<button type="button" class="swatch${multi ? " sm" : ""}${it.variant && it.variant.id === v.id ? " on" : ""}" style="--c:${v.swatch}" aria-label="${v.name}" title="${v.name}" onclick="setItem(${i},'variant','${v.id}')"></button>`).join("")}</div>
      </div>` : ""}
      ${P.sizes ? `
      <div class="unit-line">
        ${multi ? "" : `<div class="opt-sub">Size: <b>${it.size || "choose your size"}</b></div>`}
        <div class="sizes${multi ? " sm" : ""}">${P.sizes.map(z => `<button type="button" class="size${it.size === z ? " on" : ""}" onclick="setItem(${i},'size','${z}')">${z}</button>`).join("")}</div>
        ${S.showErr && !it.size ? '<p class="err-msg">Choose a size</p>' : ""}
      </div>` : ""}
    </div>`).join("");
}
function setItem(i, k, val) {
  const it = S.items[i];
  if (k === "variant") {
    it.variant = P.variants.find(v => v.id === val);
    if (it.variant.image) {
      const idx = [...document.querySelectorAll("#slides img")].findIndex(im => im.getAttribute("src") === it.variant.image);
      if (idx >= 0) goSlide(idx);
    }
  } else it.size = val;
  if (S.items.every(x => !P.sizes || x.size)) { S.showErr = false; document.getElementById("buy-err").hidden = true; }
  renderUnits(); refresh();
}
function pickQty(q, el) {
  S.qty = q;
  while (S.items.length < q) S.items.push({ variant: S.items[S.items.length - 1].variant, size: null });
  S.items.length = q;
  document.querySelectorAll(".bundle").forEach(b => b.classList.remove("on")); el.closest(".bundle").classList.add("on");
  renderUnits(); refresh();
}
function step(d) {
  S.qty = Math.min(5, Math.max(1, S.qty + d)); document.getElementById("qtyv").textContent = S.qty;
  while (S.items.length < S.qty) S.items.push({ variant: S.items[0].variant, size: null });
  S.items.length = S.qty; renderUnits(); refresh();
}
function scrollToBuy() { document.getElementById("buybox").scrollIntoView({ behavior: "smooth", block: "start" }); }
function openSizes() {
  const g = P.sizeGuide;
  document.getElementById("size-content").innerHTML = `<h3>Size guide</h3>
    <table><thead><tr>${g.headers.map(h => `<th>${h}</th>`).join("")}</tr></thead>
    <tbody>${g.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>
    <p class="small muted">${g.tip || ""}</p>`;
  document.getElementById("size-dialog").showModal();
}

async function buy(btn) {
  if (P.sizes && S.items.some(it => !it.size)) {
    S.showErr = true; renderUnits();
    const m = document.getElementById("buy-err");
    m.textContent = S.items.length > 1 ? "Choose a size for each item" : "Choose your size to continue"; m.hidden = false;
    const first = document.querySelector(".unit.missing");
    if (first) { first.scrollIntoView({ behavior: "smooth", block: "center" }); first.classList.remove("shake"); void first.offsetWidth; first.classList.add("shake"); }
    return;
  }
  const label = btn.innerHTML; btn.disabled = true; btn.textContent = "Opening secure checkout…";
  try {
    const r = await fetch("/api/checkout", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ productId: P.id, quantity: S.qty,
        items: S.items.map(it => ({ variantId: it.variant && it.variant.id, size: it.size })) }) });
    const d = await r.json();
    if (d.url) { location.href = d.url; return; }
    throw new Error(d.error || "Error");
  } catch (e) {
    btn.disabled = false; btn.innerHTML = label;
    const m = document.getElementById("buy-err");
    m.textContent = "Could not open checkout: " + e.message; m.hidden = false;
  }
}

fetch("/api/products").then(r => r.json()).then(cfg => {
  window.CFG = cfg;
  document.getElementById("year").textContent = new Date().getFullYear();
  ["logo", "logo-foot"].forEach(id => document.getElementById(id).textContent = cfg.storeName);
  const slug = location.pathname.replace(/^\/|\/$|\.html$/g, "") || qs.get("p");
  const list = cfg.products;
  P = list.find(p => p.id === slug) || (list.length === 1 ? list[0] : null);
  const app = document.getElementById("app");
  if (!P) { document.title = cfg.storeName; app.innerHTML = grid(list); return; }
  document.title = `${P.name} · ${cfg.storeName}`;
  S.items = [{ variant: P.variants ? P.variants[0] : null, size: null }];
  app.innerHTML = productPage(P);
  renderUnits();
  refresh();
  // barra fija en móvil cuando el botón principal sale de pantalla
  const sticky = document.getElementById("sticky");
  document.getElementById("sticky-btn").onclick = () => buy(document.getElementById("buy-btn"));
  new IntersectionObserver(([e]) => { sticky.hidden = e.isIntersecting || e.boundingClientRect.top > 0; })
    .observe(document.getElementById("buy-btn"));
  // miniaturas siguen al deslizar
  const slides = document.getElementById("slides");
  slides.addEventListener("scroll", () => {
    const i = Math.round(slides.scrollLeft / slides.clientWidth);
    document.querySelectorAll(".thumb").forEach((t, j) => t.classList.toggle("on", i === j));
  }, { passive: true });
});
</script>
</body>
</html>
